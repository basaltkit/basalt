name: Release

on:
  push:
    branches: [main]
  # A release run that fails at startup — as one did when the repository's
  # workflow permissions were changed — cannot be retried, and the push trigger
  # offers no second chance without an empty commit on a protected branch.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm publish with provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The same token the Changesets step uses, so the branch it pushes is
          # pushed as a person and the pull request's checks run. See below.
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens a "Version Packages" PR when changesets are pending, and
      # publishes to npm when that PR is merged (no pending changesets left).
      - name: Changesets
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          # One tag per package version, no GitHub release: the per-package
          # notes live in each CHANGELOG.md; releases are the umbrella v1.x ones.
          create-github-releases: false
          # A pull request opened with GITHUB_TOKEN starts no workflow runs —
          # GitHub's own guard against a workflow triggering itself forever. The
          # consequence here is that the "Version Packages" PR arrives with no
          # checks at all, and `main`'s protection then blocks it for missing the
          # very checks that could never run. Merging it took an empty commit
          # pushed by hand.
          #
          # RELEASE_TOKEN is a fine-grained PAT with Contents and Pull requests
          # set to read/write on this repository. Opening the PR as a person
          # makes the checks run. Falls back to GITHUB_TOKEN so a fork, or this
          # repository before the secret exists, still releases — with the
          # manual step above.
          #
          # It is an input and not the GITHUB_TOKEN environment variable: this
          # version of the action refuses to start when both are set and differ,
          # rather than guessing which one was meant.
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # setup-node's generated .npmrc reads the token from NODE_AUTH_TOKEN;
          # passing it as NPM_TOKEN left ${NODE_AUTH_TOKEN} empty → anonymous
          # publish → E404. The secret name stays NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # PNPM_, not NPM_: pnpm 11 reads its settings from the environment
          # only under the pnpm_config_ / PNPM_CONFIG_ prefix (npm_config_ is
          # still read for `userconfig` alone). NPM_CONFIG_PROVENANCE was set
          # here from the start and silently did nothing, so no version up to
          # this change carries an attestation (#409). Check with
          # `PNPM_CONFIG_PROVENANCE=true pnpm config get provenance`.
          PNPM_CONFIG_PROVENANCE: "true"

      # Provenance is easy to lose without noticing (#409 went unseen for every
      # release since 1.0), so a publish is not finished until npm shows an
      # attestation for every version it put out. The registry can lag behind
      # the publish, so each package gets a few minutes before it counts.
      - name: Verify provenance attestations
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node --input-type=module <<'EOF'
          import { execFileSync } from 'node:child_process';
          // changesets/action fills publishedPackages by parsing the publish
          // output, and it does not read @changesets/cli 3's "Successfully
          // published:" list: the first release with this step got `published`
          // true and an empty list. The tags `changeset publish` just created
          // on this commit name every version it put out, so they are the
          // fallback (name@version, split at the last @).
          let published = []
          try { published = JSON.parse(process.env.PUBLISHED || '[]') } catch { published = [] }
          if (published.length === 0) {
            published = execFileSync('git', ['tag', '--points-at', 'HEAD'], { encoding: 'utf8' })
              .split('\n').map((tag) => tag.trim()).filter(Boolean)
              .map((tag) => ({ name: tag.slice(0, tag.lastIndexOf('@')), version: tag.slice(tag.lastIndexOf('@') + 1) }))
              .filter(({ name, version }) => name && /^\d+\.\d+\.\d+/.test(version))
          }
          if (published.length === 0) {
            console.log('::error::changesets says it published, but neither publishedPackages nor the tags on HEAD name a version')
            process.exit(1)
          }
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const attested = (spec) => {
            try {
              // stderr ignored: a version the registry does not serve yet is an
              // E404, retried below, not a log full of npm errors.
              const out = execFileSync('npm', ['view', spec, 'dist.attestations.provenance', '--json'], { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] });
              return out.trim() !== '';
            } catch {
              return false;
            }
          };
          // Poll the whole set at once (10 rounds, 30 s apart) rather than
          // waiting per package: a release can carry dozens of packages.
          let missing = published.map(({ name, version }) => `${name}@${version}`);
          for (let round = 0; round < 10 && missing.length > 0; round++) {
            if (round > 0) await sleep(30_000);
            missing = missing.filter((spec) => !attested(spec));
          }
          for (const { name, version } of published) {
            const spec = `${name}@${version}`;
            console.log(`${missing.includes(spec) ? 'MISSING' : 'ok     '} ${spec}`);
          }
          if (missing.length > 0) {
            console.log(`::error::${missing.length} of ${published.length} published versions have no provenance attestation: ${missing.join(', ')}`);
            process.exit(1);
          }
          EOF
