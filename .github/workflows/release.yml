name: Release

on:
  push:
    branches: [main]
  # A release run that fails at startup — as one did when the repository's
  # workflow permissions were changed — cannot be retried, and the push trigger
  # offers no second chance without an empty commit on a protected branch.
  workflow_dispatch:

concurrency: release

permissions:
  contents: write
  pull-requests: write
  # Required for npm publish with provenance.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # Opens a "Version Packages" PR when changesets are pending, and
      # publishes to npm when that PR is merged (no pending changesets left).
      - name: Changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's generated .npmrc reads the token from NODE_AUTH_TOKEN;
          # passing it as NPM_TOKEN left ${NODE_AUTH_TOKEN} empty → anonymous
          # publish → E404. The secret name stays NPM_TOKEN.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
