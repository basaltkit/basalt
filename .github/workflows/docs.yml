name: Docs

# The repo is private and GitHub Pages is not available on the current plan, so
# the docs are hosted on a static host (Cloudflare Pages / Netlify / Vercel) —
# see apps/docs/DEPLOY.md. This workflow is retained for a future switch to
# Pages (make the repo public, then re-add the `push` trigger) and only runs on
# demand.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm --filter docs docs:build
      - uses: actions/configure-pages@v5
        with:
          # Create the Pages site on first run so deploy doesn't 404.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
