version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    ignore:
      # TypeScript majors are deliberate migrations, and apps/docs pins
      # typescript 6 because TypeDoc 0.28 does not support TypeScript 7 yet
      # (a grouped bump to 7 breaks `pnpm docs:api`).
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # Prisma 8 is a deliberate migration (no `prisma generate`; the ORM reads
      # an emitted contract instead). Dependabot treats its release candidates
      # as the latest version and moved every `^7` range to `^8.0.0-rc.*`,
      # breaking pg-integration and the create-basalt --prisma scaffold. Only
      # apps/prisma8-integration tracks the RC, and it pins an exact 8.x, so
      # RC-to-RC bumps there are not majors and still arrive.
      - dependency-name: prisma
        update-types: ['version-update:semver-major']
      - dependency-name: '@prisma/*'
        update-types: ['version-update:semver-major']
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # init and analyze must run the same version: one bump alone fails the
      # required analyze check ("Loaded a configuration file for version …").
      codeql-action:
        patterns:
          - github/codeql-action*
    labels:
      - dependencies
      - ci
