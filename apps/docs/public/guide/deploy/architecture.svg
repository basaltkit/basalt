<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">How @basaltkit/deploy and @basaltkit/deploy-ui fit together</title>
  <desc id="d">On your machine, the browser talks to deploy-ui on 127.0.0.1, which starts your system ssh. Over SSH, as the app user, the server runs basalt-deploy from the checkout's node_modules. Root runs only its own pinned copy, for bootstrap and install, and reads the install plan as data.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2C3843"/>
    </marker>
    <marker id="arrow-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#FF5A1F"/>
    </marker>
    <style>
      .t { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0B0E13; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2C3843; }
      .h { font-size: 15px; font-weight: 700; letter-spacing: .02em; }
      .b { font-size: 14px; font-weight: 600; }
      .s { font-size: 12px; fill: #2C3843; }
      .xs { font-size: 11px; }
      .muted { fill: #5B6B79; }
      .box { fill: #FFFFFF; stroke: #8B9AA7; stroke-width: 1.2; }
      .zone { fill: #EEF1F4; stroke: #C9D1D8; stroke-width: 1; }
      .root { fill: #FFFFFF; stroke: #2C3843; stroke-width: 1.4; }
      .line { stroke: #2C3843; stroke-width: 1.6; fill: none; }
      .hot { stroke: #FF5A1F; stroke-width: 2; fill: none; }
      .dash { stroke: #FF5A1F; stroke-width: 1.4; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <!-- Neutral panel so the diagram reads the same in light and dark themes -->
  <rect x="0" y="0" width="1000" height="560" rx="16" fill="#F7F8FA" stroke="#D5DBE1"/>

  <!-- Your machine -->
  <rect class="zone" x="24" y="24" width="330" height="512" rx="12"/>
  <text class="t h" x="44" y="54">YOUR MACHINE</text>
  <text class="t s muted" x="44" y="74">your keys, your agent, your known_hosts</text>

  <rect class="box" x="44" y="96" width="290" height="78" rx="10"/>
  <text class="t b" x="62" y="124">Browser tab</text>
  <text class="t s" x="62" y="146">one session: launch code → bearer token</text>
  <text class="t s" x="62" y="164">.env answers typed here, never stored</text>

  <rect class="box" x="44" y="214" width="290" height="96" rx="10"/>
  <text class="t b" x="62" y="242">basalt-deploy-ui</text>
  <text class="m xs" x="62" y="264">http://127.0.0.1:&lt;port the OS picks&gt;</text>
  <text class="t s" x="62" y="284">targets file (0600, no secret)</text>
  <text class="t s" x="62" y="300">validates every event it receives</text>

  <rect class="box" x="44" y="350" width="290" height="96" rx="10"/>
  <text class="t b" x="62" y="378">system ssh</text>
  <text class="m xs" x="62" y="400">BatchMode=yes</text>
  <text class="m xs" x="62" y="416">StrictHostKeyChecking=yes</text>
  <text class="m xs" x="62" y="432">ForwardAgent=no · argv only</text>

  <text class="t s muted" x="44" y="478">or the same command from a terminal:</text>
  <text class="m xs" x="44" y="498">ssh deploy@host 'cd /srv/acme &amp;&amp;</text>
  <text class="m xs" x="44" y="514">node …/deploy/dist/bin.js run'</text>

  <line class="line" x1="189" y1="176" x2="189" y2="210" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="t xs muted" x="198" y="198">loopback only</text>
  <line class="line" x1="189" y1="312" x2="189" y2="346" marker-end="url(#arrow)"/>
  <text class="t xs muted" x="198" y="334">one ssh per action</text>

  <!-- Server -->
  <rect class="zone" x="418" y="24" width="558" height="512" rx="12"/>
  <text class="t h" x="438" y="54">SERVER</text>
  <text class="t s muted" x="438" y="74">one Linux host, nothing listens for the deploy</text>

  <!-- App user lane -->
  <rect class="box" x="438" y="96" width="518" height="214" rx="10"/>
  <text class="t b" x="456" y="124">App user (here deploy), in the checkout /srv/acme</text>
  <text class="m xs" x="456" y="146">node node_modules/@basaltkit/deploy/dist/bin.js &lt;command&gt;</text>
  <text class="t s" x="456" y="168">plan · run · status · rollback · env · install-plan · attach · cancel</text>
  <text class="t s" x="456" y="188">the version your lockfile pins; can change everything in the checkout</text>

  <rect x="456" y="204" width="152" height="90" rx="8" fill="#F7F8FA" stroke="#C9D1D8"/>
  <text class="t s" x="468" y="226" style="font-weight:600;fill:#0B0E13">The app</text>
  <text class="t xs" x="468" y="246">PM2 or Docker Compose</text>
  <text class="t xs" x="468" y="262">on 127.0.0.1:&lt;port&gt;</text>
  <text class="t xs" x="468" y="278">health-checked</text>

  <rect x="620" y="204" width="152" height="90" rx="8" fill="#F7F8FA" stroke="#C9D1D8"/>
  <text class="t s" x="632" y="226" style="font-weight:600;fill:#0B0E13">Dedicated infra</text>
  <text class="t xs" x="632" y="246">Postgres, Redis, MinIO</text>
  <text class="t xs" x="632" y="262">named acme-pg, …</text>
  <text class="t xs" x="632" y="278">dump before migrating</text>

  <rect x="784" y="204" width="156" height="90" rx="8" fill="#F7F8FA" stroke="#C9D1D8"/>
  <text class="t s" x="796" y="226" style="font-weight:600;fill:#0B0E13">State directory</text>
  <text class="m xs" x="796" y="246">/var/lib/basalt/acme</text>
  <text class="t xs" x="796" y="262">releases, lock, holds,</text>
  <text class="t xs" x="796" y="278">run logs, backups</text>

  <!-- Trust boundary -->
  <line class="dash" x1="438" y1="340" x2="956" y2="340"/>
  <rect x="446" y="330" width="336" height="20" rx="4" fill="#EEF1F4"/>
  <text class="t xs" x="614" y="344" text-anchor="middle" style="fill:#FF5A1F;font-weight:700">TRUST BOUNDARY · root never runs the checkout's code</text>

  <!-- Root lane -->
  <rect class="root" x="438" y="366" width="518" height="150" rx="10"/>
  <text class="t b" x="456" y="394">root, once per server, from its own pinned copy</text>
  <text class="m xs" x="456" y="416">cd / &amp;&amp; sudo -H npx --yes --package=@basaltkit/deploy@0.5.1 --</text>
  <text class="m xs" x="456" y="432">  basalt-deploy bootstrap | install</text>
  <text class="t s" x="456" y="458">reads install-plan.json as data (never deploy.config.ts or node_modules)</text>
  <text class="t s" x="456" y="478">writes the Apache/Caddy site, /var/lib/basalt/&lt;app&gt;, /etc/&lt;app&gt;</text>
  <text class="t s muted" x="456" y="500">not reachable from the UI</text>

  <line class="line" x1="900" y1="310" x2="900" y2="362" marker-end="url(#arrow)"/>
  <text class="t xs muted" x="892" y="328" text-anchor="end">install-plan.json</text>
  <!-- SSH link -->
  <path class="hot" d="M336 398 C 380 398, 380 160, 434 160" marker-end="url(#arrow-m)"/>
  <rect x="352" y="262" width="56" height="40" rx="6" fill="#F7F8FA"/>
  <text class="t b" x="380" y="280" text-anchor="middle" style="fill:#FF5A1F">SSH</text>
  <text class="t xs" x="380" y="295" text-anchor="middle">app user</text>

</svg>
