<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t" fill="currentColor">
  <title id="t">Basalt — monochrome mark (single ink / print)</title>
  <!-- Single-hue via currentColor; set `color` for light or dark contexts. The
       molten face is rendered as the darkest plane so the crystal reads in one ink. -->
  <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <polygon points="52.37,72.5 100,45 100,100" fill-opacity="0.30"/>
    <polygon points="100,45 147.63,72.5 100,100" fill-opacity="0.42"/>
    <polygon points="52.37,72.5 100,100 52.37,127.5" fill-opacity="0.72"/>
    <polygon points="52.37,127.5 100,100 100,155" fill-opacity="0.85"/>
    <polygon points="100,100 147.63,72.5 147.63,127.5" fill-opacity="1"/>
    <polygon points="100,100 147.63,127.5 100,155" fill-opacity="0.9"/>
  </g>
  <line x1="100" y1="100" x2="100" y2="155" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-opacity="0.25"/>
</svg>
