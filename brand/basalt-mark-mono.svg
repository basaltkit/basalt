<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="currentColor" role="img" aria-labelledby="t">
  <title id="t">Basalt — monochrome hexagonal column mark</title>
  <!-- Single-hue: depth carried by opacity tints of currentColor. Set `color` to ink or paper. -->
  <g stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <polygon points="127.5,27.37 155,75 127.5,122.63 72.5,122.63 45,75 72.5,27.37" fill-opacity="0.35"/>
    <polygon points="45,75 72.5,122.63 72.5,167.63 45,120" fill-opacity="0.85"/>
    <polygon points="72.5,122.63 127.5,122.63 127.5,167.63 72.5,167.63" fill-opacity="0.65"/>
    <polygon points="127.5,122.63 155,75 155,120 127.5,167.63" fill-opacity="1"/>
  </g>
  <!-- molten seam rendered as a knockout groove so the mark stays truly single-colour -->
  <line x1="100" y1="124.5" x2="100" y2="165.6" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-opacity="0.2"/>
</svg>
