<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-labelledby="t">
  <title id="t">Basalt — horizontal logo for light backgrounds</title>
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9AA8B5"/><stop offset="1" stop-color="#5E6E7C"/></linearGradient>
    <linearGradient id="lit2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B8B99"/><stop offset="1" stop-color="#4A5A6A"/></linearGradient>
    <linearGradient id="shadow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3C4C59"/><stop offset="1" stop-color="#1B242D"/></linearGradient>
    <linearGradient id="shadow2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C3843"/><stop offset="1" stop-color="#141B22"/></linearGradient>
    <linearGradient id="molten" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC15E"/><stop offset=".45" stop-color="#FF5A1F"/><stop offset="1" stop-color="#B23A10"/></linearGradient>
    <linearGradient id="molten2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF7A2E"/><stop offset="1" stop-color="#8E2E0E"/></linearGradient>
  </defs>
  <g transform="translate(14,16) scale(0.84)">
    <g stroke="#0E1116" stroke-width="1.8" stroke-linejoin="round">
      <polygon points="52.37,72.5 100,45 100,100" fill="url(#lit)"/>
      <polygon points="100,45 147.63,72.5 100,100" fill="url(#lit2)"/>
      <polygon points="52.37,72.5 100,100 52.37,127.5" fill="url(#shadow)"/>
      <polygon points="52.37,127.5 100,100 100,155" fill="url(#shadow2)"/>
      <polygon points="100,100 147.63,72.5 147.63,127.5" fill="url(#molten)"/>
      <polygon points="100,100 147.63,127.5 100,155" fill="url(#molten2)"/>
