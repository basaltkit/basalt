    <polyline points="100,45 147.63,72.5 147.63,127.5" fill="none" stroke="#FFB347" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
    <line x1="100" y1="100" x2="100" y2="155" stroke="#FFD27A" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  </g>
  <text x="204" y="132" font-family="'Helvetica Neue','Arial Nova',Arial,sans-serif" font-size="104" font-weight="600" letter-spacing="-3" fill="#14181F">Basalt</text>
