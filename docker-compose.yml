# Local development stack: PostgreSQL, Redis and MinIO.
# Integration tests do NOT require this — they use pglite (in-process Postgres).
# Use this to run a real app locally, or to test against a server Postgres.
#
#   docker compose up -d
#
# Connection strings:
#   DATABASE_URL=postgresql://machize:machize@localhost:5432/machize
#   REDIS_URL=redis://localhost:6379
#   S3 endpoint http://localhost:9000 (console :9001)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: machize
      POSTGRES_PASSWORD: machize
      POSTGRES_DB: machize
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U machize"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: machize
      MINIO_ROOT_PASSWORD: machize123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
