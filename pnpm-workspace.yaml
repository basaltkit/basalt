packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: false
auditConfig:
  ignoreGhsas:
    # vite dev-server `server.fs.deny` bypass (Windows) — reaches us only through
    # vitepress (docs tooling), which pins vite 5; it never ships in a published
    # package and doesn't affect the built static docs. Not fixable without
    # breaking vitepress. Production deps are audited normally.
    - GHSA-fx2h-pf6j-xcff
    # nanoid infinite-loop with attacker-controlled CUSTOM alphabets. Reaches us
    # only through build tooling (vite>postcss>nanoid, via vitest/vitepress/
    # tailwind); never in a published package, and we never pass a custom
    # generator. Dev/build-only; not exploitable here.
    - GHSA-2v37-7h3g-55p8
    # deepmerge-ts stack exhaustion on deeply-recursive object graphs. Reaches us
    # only through the Prisma CLI's config parsing (@prisma/client>prisma>@prisma/
    # config>deepmerge-ts) at build/dev time — pinned by Prisma, not overridable
    # without breaking @prisma/config, and never on a request path. Low real-world
    # exploitability; production runtime deps are unaffected.
    - GHSA-ggr8-5vv4-36mx

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0
  - '@types/node@26.3.0'
  - bullmq@6.2.1

# Force zod 4 across the tree while ranges stay `^3 || ^4` (library compat).
overrides:
  # GHSA-3f6p-5ww8-9rcr (high): mysql2 < 3.22.0 can be downgraded to the
  # mysql_clear_password auth plugin by a hostile server, leaking the password
  # in plaintext. It reaches us inside Prisma (@prisma/client > prisma > mysql2),
  # which pins an older range — so an override is the only way to raise it.
  #
  # Overridden rather than ignored: unlike every entry in `auditConfig` above,
  # this one is NOT build-only. It travels in @basaltkit/prisma's dependency
  # tree, so an app using @basaltkit/prisma against MySQL would really be
  # exposed. This repo runs Postgres/SQLite, which is why nothing here breaks.
  mysql2: ^3.24.2
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf (high):
  # fast-uri can be made to disagree with the WHATWG parser about a URL's host —
  # skipped IDN normalisation, and SSRF through hosts it parses differently from
  # the fetcher that later resolves them. It arrives through fastify's validation
  # stack (fastify > ajv / fast-json-stringify), which pins ranges below the
  # patched versions, so an override is the only way to raise it.
  #
  # Overridden rather than ignored: this one sits on the request path of every
  # application built on @basaltkit/fastify, not in build tooling. Two majors are
  # installed, each patched on its own line.
  'fast-uri@3': ^3.1.7
  'fast-uri@4': ^4.1.4
  jsdom: ^30.0.1
  '@types/node': ^26.3.0
  tailwind-merge: ^3.6.0
  bullmq: ^6.2.1
  '@hono/node-server': ^2.1.1
  ioredis: ^6.0.0
  pino: ^10.3.1
  eslint: ^10.9.1
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  zod: ^4.4.3
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
