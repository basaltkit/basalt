packages:
  - "packages/*"
  - "apps/*"
  - "tooling/*"
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: false
auditConfig:
  ignoreGhsas:
    # vite dev-server `server.fs.deny` bypass (Windows) — reaches us only through
    # vitepress (docs tooling), which pins vite 5; it never ships in a published
    # package and doesn't affect the built static docs. Not fixable without
    # breaking vitepress. Production deps are audited normally.
    - GHSA-fx2h-pf6j-xcff
    # nanoid infinite-loop with attacker-controlled CUSTOM alphabets. Reaches us
    # only through build tooling (vite>postcss>nanoid, via vitest/vitepress/
    # tailwind); never in a published package, and we never pass a custom
    # generator. Dev/build-only; not exploitable here.
    - GHSA-2v37-7h3g-55p8
    # deepmerge-ts stack exhaustion on deeply-recursive object graphs. Reaches us
    # only through the Prisma CLI's config parsing (@prisma/client>prisma>@prisma/
    # config>deepmerge-ts) at build/dev time — pinned by Prisma, not overridable
    # without breaking @prisma/config, and never on a request path. Low real-world
    # exploitability; production runtime deps are unaffected.
    - GHSA-ggr8-5vv4-36mx

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.68.0'
  - '@typescript-eslint/parser@8.68.0'
  - '@typescript-eslint/project-service@8.68.0'
  - '@typescript-eslint/scope-manager@8.68.0'
  - '@typescript-eslint/tsconfig-utils@8.68.0'
  - '@typescript-eslint/type-utils@8.68.0'
  - '@typescript-eslint/types@8.68.0'
  - '@typescript-eslint/typescript-estree@8.68.0'
  - '@typescript-eslint/utils@8.68.0'
  - '@typescript-eslint/visitor-keys@8.68.0'
  - eslint@10.9.1
  - typescript-eslint@8.68.0

# Force zod 4 across the tree while ranges stay `^3 || ^4` (library compat).
overrides:
  ioredis: ^6.0.0
  pino: ^10.3.1
  eslint: ^10.9.1
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.5
  zod: ^4.4.3
  vitest: ^4.1.11
  '@vitest/coverage-v8': ^4.1.11
